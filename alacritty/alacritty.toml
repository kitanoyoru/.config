[general]
live_config_reload = true

[debug]
log_level = "OFF"

[cursor]
style = "Block"
unfocused_hollow = true

[font]
size = 12.0

[font.bold]
family = "FiraCode Nerd Font"
style = "Medium"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "FiraCode Nerd Font"
style = "Light Italic"

[font.normal]
family = "FiraCode Nerd Font"
style = "Light"

[font.offset]
x = 1
y = 1

# rose-pine
[colors.primary]
background = "#191724"
foreground = "#e0def4"

[colors.cursor]
text = "#191724"
cursor = "#e0def4"

[colors.selection]
text = "#e0def4"
background = "#403d52"

[colors.normal]
black = "#26233a"
red = "#eb6f92"
green = "#31748f"
yellow = "#f6c177"
blue = "#9ccfd8"
magenta = "#c4a7e7"
cyan = "#ebbcba"
white = "#e0def4"

[colors.bright]
black = "#6e6a86"
red = "#eb6f92"
green = "#31748f"
yellow = "#f6c177"
blue = "#9ccfd8"
magenta = "#c4a7e7"
cyan = "#ebbcba"
white = "#e0def4"

# Alt+arrows / Alt+Backspace (word motions)
[[keyboard.bindings]]
chars = "\u001B[1;3D"
key = "Left"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u001B[1;3C"
key = "Right"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u001B[1;3A"
key = "Up"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u001B[1;3B"
key = "Down"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u001B\u007F"
key = "Back"
mods = "Alt"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Minus"
mods = "Command|Shift"

# Cmd shortcuts -> tmux (prefix is C-s = \u0013)
[[keyboard.bindings]]
chars = "\u0013&"
key = "W"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0013c"
key = "T"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0013n"
key = "RBracket"
mods = "Command|Shift"

[[keyboard.bindings]]
chars = "\u0013p"
key = "LBracket"
mods = "Command|Shift"

[[keyboard.bindings]]
chars = "\u0013o"
key = "RBracket"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0013;"
key = "LBracket"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0013/"
key = "F"
mods = "Command"

[mouse]
hide_when_typing = true

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[scrolling]
history = 0
multiplier = 3

[selection]
save_to_clipboard = false
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[window]
decorations = "full"
dynamic_padding = false
opacity = 1.0
startup_mode = "Windowed"
option_as_alt = "Both"

[window.dimensions]
columns = 130
lines = 50

[window.padding]
x = 6
y = 6

# open straight into the shared tmux session
[terminal.shell]
program = "/opt/homebrew/bin/tmux"
args = ["new-session", "-A", "-s", "main"]
