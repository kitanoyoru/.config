# set scroll history to 100,000 lines
set-option -g history-limit 100000

set-option -g default-shell /opt/homebrew/bin/fish

# modern colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"

# unbind the prefix and bind it to Ctrl-s (not ^a since that is main tmux)
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Avoid ESC delay
set -s escape-time 0

# nvim autoread / focus events
set -g focus-events on

# Fix titlebar
set -g set-titles on
set -g set-titles-string "#T"

# Mouse friendly
set -g mouse on

# VIM mode
set -g mode-keys vi

# numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# reload config
bind r source-file ~/.tmux.conf \; display-message "reloaded"

# splits and windows keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# ...except throwaway temp dirs (e.g. topgrade's cwd): fall back to the session path
bind c if-shell -F '#{m:*/T/.tmp*,#{pane_current_path}}' 'new-window' 'new-window -c "#{pane_current_path}"'

# Move between panes with vi keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy mode -> macOS clipboard
bind-key -nr C-y run "tmux show-buffer | pbcopy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy

# fzf project switcher (popup)
bind f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-sessionizer"

######################
### DESIGN CHANGES ###
######################

set -g status-position bottom

set -g status-style 'bg=#0c0d0f,fg=#6a6e77'
set -g status-fg '#6a6e77'
set -g status-justify left

# Subtle pane framing: enough contrast to find focus, but no bright borders.
set -g pane-border-style 'fg=#25282d'
set -g pane-active-border-style 'fg=#8ba3c4'
set -g message-style 'bg=#25282d,fg=#eceef2'
set -g message-command-style 'bg=#25282d,fg=#eceef2'

set -g status-left ''
set -g status-interval 1
set -g status-right '#[fg=#d6b676] #(~/.tmux/scripts/ai/agent-status)#[fg=#454951] │ #[fg=#8a8e96]#(~/.tmux/scripts/sysinfo.sh network) #[fg=#454951]· #[fg=#8a8e96]#(~/.tmux/scripts/sysinfo.sh usage) #[fg=#454951]· #[fg=#8a8e96]#(~/.tmux/scripts/sysinfo.sh disk) #[fg=#454951]· #[fg=#8a8e96]#(~/.tmux/scripts/sysinfo.sh battery) #[fg=#454951]│ #[fg=#8a8e96]%d/%m  #[fg=#eceef2,bold]%H:%M '
set -g status-right-length 140
set -g status-left-length 30

setw -g window-status-current-format '#[fg=#8ba3c4,bold]  #I #[fg=#d9dbe0]#W#[fg=#d6b676]#{s/[*]//:window_flags}#{?#{==:#{@ai_state},input},#[fg=#d6b676] ◐,#{?#{==:#{@ai_state},idle},#[fg=#9cb07e] ✓,#{?#{==:#{@ai_state},running},#[fg=#8ba3c4] ●,}}} '
setw -g window-status-current-style none
setw -g window-status-format '#[fg=#555a63]  #I #[fg=#8a8e96]#W#[fg=#3d4047]#{s/-//:window_flags}#{?#{==:#{@ai_state},input},#[fg=#d6b676] ◐,#{?#{==:#{@ai_state},idle},#[fg=#9cb07e] ✓,#{?#{==:#{@ai_state},running},#[fg=#8ba3c4] ●,}}} '


######################
###   AI ENGINE    ###
######################

set -g allow-passthrough on
set -g set-clipboard on
setw -g monitor-activity off

# tmux 3.7 popup defaults use theme colors derived from the terminal's reported
# bg; Ghostty answers that query (Alacritty doesn't), giving a gray popup. Pin it.
set -g popup-style 'bg=default,fg=default'
set -g popup-border-style 'fg=colour240'

# AI engine: run-shell is needed because display-popup does NOT expand #{...}
# placeholders inside its shell-command argument (tmux 3.7) — run-shell does.
# Popups spawn in $HOME by default, so -d must be passed explicitly.
bind a run-shell "tmux display-popup -E -w 70% -h 60% -d '#{pane_current_path}' \"$HOME/.tmux/scripts/ai/agent-spawn '#{session_name}' '#{pane_current_path}'\""
bind A display-popup -E -w 80% -h 80% "$HOME/.tmux/scripts/ai/agent-list"
bind S run-shell "tmux display-popup -E -w 80% -h 70% -d '#{pane_current_path}' \"$HOME/.tmux/scripts/ai/agent-send '#{pane_id}'\""
bind P display-popup -E -w 80% -h 70% "$HOME/.tmux/scripts/ai/agent-prompts"
bind Q run-shell "tmux display-popup -E -w 75% -h 70% -d '#{pane_current_path}' \"$HOME/.tmux/scripts/ai/agent-ask\""
bind D run-shell "tmux display-popup -E -w 90% -h 90% -d '#{pane_current_path}' \"$HOME/.tmux/scripts/ai/agent-finish '#{window_id}'\""
bind g run-shell "tmux display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit"

######################
###     PLUGINS    ###
######################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
