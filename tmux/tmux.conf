# set scroll history to 100,000 lines
set-option -g history-limit 100000

set-option -g default-shell /opt/homebrew/bin/fish

# modern colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"

# unbind the prefix and bind it to Ctrl-s (not ^a since that is main tmux)
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Avoid ESC delay
set -s escape-time 0

# nvim autoread / focus events
set -g focus-events on

# Fix titlebar
set -g set-titles on
set -g set-titles-string "#T"

# Mouse friendly
set -g mouse on

# VIM mode
set -g mode-keys vi

# numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# reload config
bind r source-file ~/.tmux.conf \; display-message "reloaded"

# splits and windows keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes with vi keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy mode -> macOS clipboard
bind-key -nr C-y run "tmux show-buffer | pbcopy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy

# fzf project switcher (popup)
bind f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-sessionizer"

######################
### DESIGN CHANGES ###
######################

set -g status-position bottom

set -g status-bg colour234
set -g status-fg colour137

set -g status-left ''
set -g status-interval 1
set -g status-right '#[fg=colour214,bg=colour234] #(~/.tmux/scripts/ai/agent-status)#[fg=colour250,bg=colour236] #(~/.tmux/scripts/sysinfo.sh network) #[fg=colour250,bg=colour238] #(~/.tmux/scripts/sysinfo.sh disk) #[fg=colour250,bg=colour239] #(~/.tmux/scripts/sysinfo.sh battery) #[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 120
set -g status-left-length 30

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F#{?#{==:#{@ai_state},input},#[fg=colour214] ◐,#{?#{==:#{@ai_state},idle},#[fg=colour114] ✓,#{?#{==:#{@ai_state},running},#[fg=colour75] ●,}}} '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F#{?#{==:#{@ai_state},input},#[fg=colour214] ◐,#{?#{==:#{@ai_state},idle},#[fg=colour114] ✓,#{?#{==:#{@ai_state},running},#[fg=colour75] ●,}}} '


######################
###   AI ENGINE    ###
######################

set -g allow-passthrough on
set -g set-clipboard on
setw -g monitor-activity off

bind a display-popup -E -w 70% -h 60% -d "#{pane_current_path}" "~/.tmux/scripts/ai/agent-spawn '#{session_name}' '#{pane_current_path}'"
bind A display-popup -E -w 80% -h 80% "~/.tmux/scripts/ai/agent-list"
bind S display-popup -E -w 80% -h 70% "~/.tmux/scripts/ai/agent-send '#{pane_id}'"
bind P display-popup -E -w 80% -h 70% "~/.tmux/scripts/ai/agent-prompts"
bind D display-popup -E -w 90% -h 90% "~/.tmux/scripts/ai/agent-finish '#{window_id}'"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

######################
###     PLUGINS    ###
######################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
